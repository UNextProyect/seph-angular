<div class="admin-cards">

  <article class="admin-card">

    <h3 class="admin-card__title">Registro de Enlaces Académicos por Instituciones
    </h3>
    <button class="admin-card__button" type="button" routerLink="/admin/enlaces">Registrar Enlace</button>

      routerLink="/admin/bitacoras/Institucion">Ver bitácora</button>

      routerLink="/admin/bitacoras/Periodo">Ver bitácora</button>

    <button class="admin-card__button admin-card__button--secondary" type="button"

  Administración del catálogo de preguntas
  utilizadas en el análisis estratégico.
-->

    <img src="imagenes/Registro-Periodo.svg" alt="Administración de Preguntas de Análisis Estratégico" />

    <button class="admin-card__button" type="button" routerLink="/admin/strategic-analysis-questions">

    </button>
